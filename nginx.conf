# ── Nginx configuration for VS-AI ───────────────────────────────────
# Mirrors the .htaccess rewrite / security rules from the original
# Apache config.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.php;

    server_name _;

    # ── Security headers ───────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Disable directory listing ─────────────────────────────────
    autoindex off;

    # ── Block access to config.php (contains API key) ─────────────
    location ~ ^/config\.php$ {
        deny all;
        return 403;
    }

    # ── Block sensitive dotfiles ──────────────────────────────────
    location ~ /\.(env|ini|log|bak|sql|gitignore)$ {
        deny all;
        return 403;
    }

    # ── Block common exploit paths ────────────────────────────────
    location ~ ^/(wp-admin|wp-login|\.env|composer\.(json|lock)) {
        deny all;
        return 403;
    }

    # ── Pretty URLs (mirroring .htaccess RewriteRules) ────────────
    location = /chat {
        rewrite ^ /chat.php last;
    }

    location = /api/chat {
        rewrite ^ /api.php last;
    }

    location = /api/config {
        return 404;
    }

    # ── PHP processing via PHP-FPM ───────────────────────────────
    location ~ \.php$ {
        # Block access to config.php at the PHP level too
        if ($request_uri ~* "^/config\.php") {
            return 403;
        }

        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;

        # SSE streaming support — disable buffering
        fastcgi_buffering off;
        fastcgi_buffer_size 0;
        fastcgi_buffers 0 0;
        fastcgi_param  PHP_VALUE "output_buffering=0";
    }

    # ── Static files ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }
}
