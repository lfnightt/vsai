<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Updates — VS-AI</title>
    <style>
        :root {
            --bg: #000;
            --surface: #111;
            --surface-hover: #1a1a1a;
            --border: #222;
            --text: #fff;
            --text-secondary: #afafaf;
            --text-muted: #888;
            --accent: #6e56cf;
            --accent-bg: rgba(110, 86, 207, 0.1);
        }
        [data-theme="light"] {
            --bg: #fff;
            --surface: #f5f5f5;
            --surface-hover: #efefef;
            --border: #e0e0e0;
            --text: #000;
            --text-secondary: #666;
            --text-muted: #555;
            --accent: #6e56cf;
            --accent-bg: rgba(110, 86, 207, 0.06);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Top bar ── */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: rgba(0,0,0,0.8);
        }
        [data-theme="light"] .topbar {
            background: rgba(255,255,255,0.85);
        }
        .topbar-back {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            text-decoration: none;
            background: none;
            border: none;
        }
        .topbar-back:hover {
            background: var(--surface-hover);
            color: var(--text);
        }
        .topbar-back svg {
            width: 18px;
            height: 18px;
        }
        .topbar-title {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .topbar-badge {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            background: var(--accent-bg);
            padding: 2px 8px;
            border-radius: 6px;
        }

        /* ── Content ── */
        .content {
            max-width: 640px;
            margin: 0 auto;
            padding: 32px 20px 80px;
        }
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }
        .page-header p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* ── Timeline ── */
        .timeline {
            position: relative;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 15px;
            top: 0;
            bottom: 0;
            width: 1px;
            background: var(--border);
        }
        .update-item {
            position: relative;
            padding-left: 44px;
            margin-bottom: 32px;
        }
        .update-item:last-child {
            margin-bottom: 0;
        }
        .update-dot {
            position: absolute;
            left: 9px;
            top: 4px;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--border);
            border: 2px solid var(--bg);
        }
        .update-item:first-child .update-dot {
            background: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-bg);
        }
        .update-date {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 6px;
        }
        .update-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }
        .update-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .update-tag {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 3px 8px;
            border-radius: 5px;
            margin-top: 8px;
        }
        .tag-feature { background: rgba(48, 164, 108, 0.12); color: #30a46c; }
        .tag-fix { background: rgba(229, 72, 77, 0.12); color: #e5484d; }
        .tag-improvement { background: rgba(110, 86, 207, 0.12); color: var(--accent); }
        .tag-security { background: rgba(255, 200, 55, 0.12); color: #ffc837; }

        /* ── Empty state ── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state svg {
            width: 48px;
            height: 48px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 1.5;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .empty-state p {
            font-size: 14px;
            line-height: 1.5;
        }

        /* ── Version badge ── */
        .version-info {
            text-align: center;
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }
        .version-info span {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', ui-monospace, monospace;
        }
    </style>
</head>
<body>
    <!-- Top bar -->
    <div class="topbar">
        <a href="/" class="topbar-back" title="Back to Chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        </a>
        <span class="topbar-title">Updates</span>
        <span class="topbar-badge" id="versionBadge">v...</span>
    </div>

    <!-- Content -->
    <div class="content">
        <div class="page-header">
            <h1>🔔 What's New</h1>
            <p>Track all the changes, improvements, and new features in VS-AI.</p>
        </div>

        <div class="timeline" id="timeline">
            <!-- Updates will be loaded dynamically -->
        </div>

        <div class="version-info">
            <span id="versionFooter">Loading version...</span>
        </div>
    </div>

    <script>
        // Fetch version
        fetch('/api/version').then(function(r){return r.json()}).then(function(d){
            if(d.version){
                document.getElementById('versionBadge').textContent = 'v'+d.version;
                document.getElementById('versionFooter').textContent = 'VS-AI v'+d.version + (d.buildDate ? ' — Built '+new Date(d.buildDate).toLocaleDateString() : '');
            }
        }).catch(function(){});

        // Update entries (can be expanded later via API or static JSON)
        var updates = [
            {
                date: 'Aug 28, 2026',
                title: 'Updates Page Launched',
                desc: 'A dedicated Updates page to track all changes, fixes, and new features in VS-AI.',
                tag: 'feature',
                tagLabel: 'Feature'
            },
            {
                date: 'Aug 28, 2026',
                title: 'Sidebar Updates Button',
                desc: 'Added an Updates button in the sidebar with responsive collapsed/expanded states matching the New Chat button style.',
                tag: 'feature',
                tagLabel: 'Feature'
            },
            {
                date: 'Aug 28, 2026',
                title: 'Version Badge Fix',
                desc: 'Version badge now fetches from /api/version endpoint instead of server-side injection. Displays correctly as v2.1.0.',
                tag: 'fix',
                tagLabel: 'Fix'
            },
            {
                date: 'Aug 28, 2026',
                title: 'PHP to Node.js Migration',
                desc: 'Complete migration from PHP/Apache to Node.js/Express. Includes SSE streaming proxy, CSRF protection, rate limiting, and Docker support for Railway deployment.',
                tag: 'improvement',
                tagLabel: 'Improvement'
            },
            {
                date: 'Aug 28, 2026',
                title: 'Security Headers & CSRF',
                desc: 'Added X-Content-Type-Options, X-Frame-Options, Referrer-Policy, Permissions-Policy headers. Session-bound CSRF token for API requests.',
                tag: 'security',
                tagLabel: 'Security'
            }
        ];

        var timeline = document.getElementById('timeline');
        if (updates.length === 0) {
            timeline.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><p>No updates yet.<br>Check back soon!</p></div>';
        } else {
            updates.forEach(function(u) {
                var item = document.createElement('div');
                item.className = 'update-item';
                item.innerHTML = '<div class="update-dot"></div>' +
                    '<div class="update-date">' + u.date + '</div>' +
                    '<div class="update-title">' + u.title + '</div>' +
                    '<div class="update-desc">' + u.desc + '</div>' +
                    '<span class="update-tag tag-' + u.tag + '">' + u.tagLabel + '</span>';
                timeline.appendChild(item);
            });
        }
    </script>
</body>
</html>
