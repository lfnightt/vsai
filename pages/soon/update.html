<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Updates — VS-AI</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --surface-hover: #1c1c1c;
            --border: rgba(255,255,255,0.06);
            --text: #f0f0f0;
            --text-secondary: #a0a0a0;
            --text-muted: #666;
            --accent: #7c66e6;
            --accent-dim: rgba(124,102,230,0.1);
            --green: #3dd68c;
            --green-dim: rgba(61,214,140,0.1);
            --red: #f06060;
            --red-dim: rgba(240,96,96,0.1);
            --yellow: #f0c040;
            --yellow-dim: rgba(240,192,64,0.1);
        }
        [data-theme="light"] {
            --bg: #f8f8fa;
            --surface: #fff;
            --surface-hover: #f0f0f2;
            --border: rgba(0,0,0,0.07);
            --text: #1a1a1a;
            --text-secondary: #555;
            --text-muted: #999;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Nav ── */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 24px;
            background: color-mix(in srgb, var(--bg) 80%, transparent);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }
        .back {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: none;
            background: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: all .15s;
            text-decoration: none;
            flex-shrink: 0;
        }
        .back:hover { background: var(--surface-hover); color: var(--text); }
        .back svg { width: 18px; height: 18px; }
        .nav-title {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -.02em;
        }
        .nav-badge {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            background: var(--accent-dim);
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: .01em;
            flex-shrink: 0;
        }

        /* ── Main ── */
        main {
            max-width: 560px;
            margin: 0 auto;
            padding: 40px 24px 100px;
        }

        /* ── Hero ── */
        .hero {
            text-align: center;
            margin-bottom: 48px;
        }
        .hero-icon {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: var(--accent-dim);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .hero-icon svg {
            width: 30px;
            height: 30px;
            stroke: var(--accent);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .hero h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -.03em;
            margin-bottom: 8px;
            line-height: 1.2;
        }
        .hero p {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* ── Cards ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px 24px;
            margin-bottom: 12px;
            transition: border-color .2s, transform .15s;
        }
        .card:hover {
            border-color: rgba(255,255,255,0.1);
            transform: translateY(-1px);
        }
        [data-theme="light"] .card:hover {
            border-color: rgba(0,0,0,0.12);
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            gap: 8px;
        }
        .card-date {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            flex-shrink: 0;
        }
        .card-tag {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            flex-shrink: 0;
        }
        .card-tag.feature { background: var(--green-dim); color: var(--green); }
        .card-tag.fix { background: var(--red-dim); color: var(--red); }
        .card-tag.update { background: var(--accent-dim); color: var(--accent); }
        .card-tag.security { background: var(--yellow-dim); color: var(--yellow); }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -.01em;
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .card-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.65;
        }
        .card-desc code {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 12px;
            background: var(--surface-hover);
            padding: 2px 6px;
            border-radius: 5px;
            border: 1px solid var(--border);
        }

        /* ── Latest badge ── */
        .latest-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--accent-dim);
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 500;
            color: var(--accent);
        }
        .latest-bar .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .4; }
        }

        /* ── Footer ── */
        .footer {
            text-align: center;
            margin-top: 56px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }
        .footer span {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', ui-monospace, monospace;
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            nav { padding: 12px 16px; }
            main { padding: 28px 16px 80px; }
            .hero h1 { font-size: 22px; }
            .card { padding: 18px 18px; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="back" title="Back to Chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        </a>
        <span class="nav-title">VS-AI</span>
        <span class="nav-badge" id="versionBadge">v...</span>
    </nav>

    <main>
        <div class="hero">
            <div class="hero-icon">
                <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </div>
            <h1>Updates & Changelog</h1>
            <p>Everything new in VS-AI — features, fixes, and improvements.</p>
        </div>

        <div id="updates"></div>

        <div class="footer">
            <span id="footerVersion">VS-AI</span>
        </div>
    </main>

    <script>
        // ── Version ──
        fetch('/api/version').then(function(r){return r.json()}).then(function(d){
            if(d.version){
                document.getElementById('versionBadge').textContent = 'v'+d.version;
                var txt = 'VS-AI v'+d.version;
                if(d.buildDate) txt += ' · '+new Date(d.buildDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
                document.getElementById('footerVersion').textContent = txt;
            }
        }).catch(function(){});

        // ── Updates data ──
        var updates = [
            {
                date: 'Aug 28, 2026',
                title: 'Updates Page & Changelog',
                desc: 'A dedicated changelog to track every change, improvement, and new feature. Protected by a password gate for admin-only access.',
                tag: 'feature'
            },
            {
                date: 'Aug 28, 2026',
                title: 'Sidebar Updates Button',
                desc: 'Added an <code>Updates</code> button to the sidebar that matches the <code>New Chat</code> button — supports collapsed and expanded states.',
                tag: 'feature'
            },
            {
                date: 'Aug 28, 2026',
                title: 'Version Badge',
                desc: 'Fixed the version badge to fetch from <code>/api/version</code> dynamically. Displays correctly as <code>v2.1.0</code> in the chat UI.',
                tag: 'fix'
            },
            {
                date: 'Aug 28, 2026',
                title: 'PHP → Node.js Migration',
                desc: 'Migrated the entire backend from PHP/Apache to Node.js/Express. Includes SSE streaming proxy, CSRF protection, session management, and Docker support.',
                tag: 'update'
            },
            {
                date: 'Aug 28, 2026',
                title: 'Security Hardening',
                desc: 'Added security headers (<code>X-Frame-Options</code>, <code>Referrer-Policy</code>, <code>Permissions-Policy</code>), session-bound CSRF tokens, and per-IP rate limiting.',
                tag: 'security'
            }
        ];

        var tagLabels = { feature: 'Feature', fix: 'Fix', update: 'Improvement', security: 'Security' };
        var container = document.getElementById('updates');

        // Latest bar
        if (updates.length > 0) {
            var bar = document.createElement('div');
            bar.className = 'latest-bar';
            bar.innerHTML = '<span class="dot"></span> Latest: ' + updates[0].title;
            container.appendChild(bar);
        }

        // Cards
        updates.forEach(function(u) {
            var card = document.createElement('div');
            card.className = 'card';
            card.innerHTML =
                '<div class="card-header">' +
                    '<span class="card-date">' + u.date + '</span>' +
                    '<span class="card-tag ' + u.tag + '">' + tagLabels[u.tag] + '</span>' +
                '</div>' +
                '<div class="card-title">' + u.title + '</div>' +
                '<div class="card-desc">' + u.desc + '</div>';
            container.appendChild(card);
        });

        // Empty state
        if (updates.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:80px 20px;color:var(--text-muted)"><p style="font-size:15px">No updates yet.</p><p style="font-size:13px;margin-top:4px">Check back soon!</p></div>';
        }
    </script>
</body>
</html>
