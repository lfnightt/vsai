<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Updates — VS-AI</title>
    <link rel="stylesheet" href="./update.css">
</head>
<body>
    <nav>
        <a href="/" class="back" title="Back to Chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        </a>
        <span class="nav-title">VS-AI</span>
        <span class="nav-badge" id="versionBadge">v...</span>
    </nav>

    <main>
        <div class="hero">
            <div class="hero-icon">
                <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </div>
            <h1>Updates & Changelog</h1>
            <p>Everything new in VS-AI — features, fixes, and improvements.</p>
        </div>
        <div id="updates"></div>
        <div class="footer"><span id="footerVersion">VS-AI</span></div>
    </main>

    <div class="overlay" id="overlay"></div>

    <div class="panel" id="panel">
        <div class="panel-header">
            <button class="panel-close" id="panelClose" title="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <span class="panel-date" id="panelDate"></span>
            <span class="panel-tag" id="panelTag"></span>
        </div>
        <div class="panel-body" id="panelBody"></div>
    </div>

    <script src="./update.js"></script>
</body>
</html>
