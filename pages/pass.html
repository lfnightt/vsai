<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access Required — VS-AI</title>
    <style>
        :root {
            --bg: #000;
            --surface: #111;
            --border: #222;
            --text: #fff;
            --text-muted: #888;
            --accent: #6e56cf;
        }
        [data-theme="light"] {
            --bg: #fff;
            --surface: #f5f5f5;
            --border: #e0e0e0;
            --text: #000;
            --text-muted: #666;
            --accent: #6e56cf;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 380px;
            padding: 20px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 32px;
            text-align: center;
        }
        .icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .icon svg {
            width: 28px;
            height: 28px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }
        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 28px;
            line-height: 1.5;
        }
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: var(--accent);
        }
        .input-group input::placeholder {
            color: var(--text-muted);
        }
        .input-group .lock-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: var(--text);
            color: var(--bg);
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }
        .btn:hover { opacity: 0.85; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .error {
            color: #e5484d;
            font-size: 12px;
            margin-top: 12px;
            display: none;
        }
        .error.show { display: block; }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: var(--text-muted);
        }
        .footer a {
            color: var(--text-muted);
            text-decoration: none;
        }
        .footer a:hover { text-decoration: underline; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .shake { animation: shake 0.4s ease; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="card">
            <div class="icon">
                <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <h1>Access Required</h1>
            <p class="subtitle">Enter the access code to view the Updates page.</p>
            <form id="passForm" autocomplete="off">
                <div class="input-group">
                    <svg class="lock-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <input type="password" id="passInput" placeholder="Enter access code" autofocus autocomplete="off">
                </div>
                <button type="submit" class="btn" id="submitBtn">Continue</button>
                <p class="error" id="errorMsg">Incorrect code. Try again.</p>
            </form>
        </div>
        <p class="footer"><a href="/">← Back to Chat</a></p>
    </div>

    <script>
        (function() {
            var form = document.getElementById('passForm');
            var input = document.getElementById('passInput');
            var btn = document.getElementById('submitBtn');
            var error = document.getElementById('errorMsg');
            var card = document.getElementById('card');

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                var password = input.value.trim();
                if (!password) {
                    input.focus();
                    return;
                }

                btn.disabled = true;
                btn.textContent = 'Verifying...';
                error.classList.remove('show');

                fetch('/pages/pass', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: password })
                })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.ok) {
                        btn.textContent = 'Access Granted';
                        btn.style.background = '#30a46c';
                        setTimeout(function() {
                            window.location.href = data.redirect || '/pages/soon/update';
                        }, 500);
                    } else {
                        error.classList.add('show');
                        card.classList.add('shake');
                        setTimeout(function() { card.classList.remove('shake'); }, 500);
                        btn.disabled = false;
                        btn.textContent = 'Continue';
                        input.value = '';
                        input.focus();
                    }
                })
                .catch(function() {
                    error.textContent = 'Connection error. Try again.';
                    error.classList.add('show');
                    btn.disabled = false;
                    btn.textContent = 'Continue';
                });
            });
        })();
    </script>
</body>
</html>
