    <script>
        window.__CHAT_MODELS__ = [{
            "id": "stealth\/ox-alpha",
            "slug": "ox-alpha",
            "name": "Ox Alpha",
            "color": "#6e56cf"
        }];
        window.__CHAT_SITE_NAME__ = "AI Chat";
        window.__CHAT_LOGO__ = './chat-logo.svg';
        window.__CHAT_LANG__ = null;
        window.__CHAT_IMAGES__ = {
            "max": 0,
            "maxBytes": 5242880,
            "history": 4
        };
        window.__CHAT_FILES__ = {
            "max": 3,
            "maxBytes": 102400
        };
        // Sidebar starts collapsed by default. Applied once per browser (flag), after which the
        // app keeps persisting whatever the user chooses.
        try {
            if (localStorage.getItem('ox_sidebar_default_v2') === null) {
                localStorage.setItem('chattest_sidebar_collapsed', 'true');
                localStorage.setItem('ox_sidebar_default_v2', '1');
            }
        } catch (e) {}

        // Response phase tracker for the "Thinking…" status. Wraps
        // (keep-alives only → queued, reasoning deltas → thinking, first content → answering).
        // Never alters the bytes the app receives.
        window.__oxPhase = 'idle';
        window.__oxPhaseAt = 0;
        (function() {
            var nativeFetch = window.fetch;
            if (!nativeFetch || !window.TransformStream || !window.TextDecoder) return;

            function setPhase(p) {
                if (window.__oxPhase !== p) {
                    window.__oxPhase = p;
                    window.__oxPhaseAt = Date.now();
                }
            }
            window.fetch = function(input, init) {
                var url = typeof input === 'string' ? input : (input && input.url) || '';
                if (url.indexOf('api.php') === -1 && url.indexOf('/api/chat') === -1) return nativeFetch.apply(this, arguments);
                input = './api/chat';
                var self = this,
                    args = [input, init];
                if (typeof window.__oxRewriteChatBody === 'function' && init && typeof init.body === 'string') {
                    try {
                        var rewritten = window.__oxRewriteChatBody(init.body);
                        if (typeof rewritten === 'string' && rewritten !== init.body) {
                            init = Object.assign({}, init, {
                                body: rewritten
                            });
                            args = [input, init];
                        }
                    } catch (e) {}
                }
                setPhase('connecting');

                function send(extraHeaders) {
                    console.debug('[api] sending to:', input, 'method:', init && init.method);
                    if (!extraHeaders) return nativeFetch.apply(self, args);
                    var init2 = Object.assign({}, init || {});
                    var h = new Headers(init2.headers || {});
                    Object.keys(extraHeaders).forEach(function(k) {
                        h.set(k, extraHeaders[k]);
                    });
                    init2.headers = h;
                    return nativeFetch.call(self, input, init2);
                }

                function track(res) {
                    console.debug('[api] response status:', res && res.status, 'ok:', res && res.ok);
                    if (!res.ok || !res.body) {
                        setPhase('idle');
                        return res;
                    }
                    try {
                        var trimmed = parseInt(res.headers.get('X-Context-Trimmed') || '0', 10);
                        if (trimmed > 0 && typeof window.__oxContextTrimmed === 'function') window.__oxContextTrimmed(trimmed, parseInt(res.headers.get('X-Context-Sent') || '0', 10));
                    } catch (e) {}
                    var decoder = new TextDecoder();
                    var tail = '';
                    var debugCount = 0;
                    var ts = new TransformStream({
                        transform: function(chunk, controller) {
                            controller.enqueue(chunk);
                            var text = tail + decoder.decode(chunk, {
                                stream: true
                            });
                            tail = text.slice(-64);
                            if (debugCount < 3) {
                                console.debug('[api] chunk', debugCount++, JSON.stringify(text.slice(0, 200)));
                            }
                            if (/"content":"[^"]/.test(text)) setPhase('answering');
                            else if (/"reasoning":"[^"]/.test(text)) {
                                if (window.__oxPhase !== 'answering') setPhase('thinking');
                            } else if (window.__oxPhase === 'connecting' && text.indexOf('PROCESSING') !== -1) setPhase('queued');
                        },
                        flush: function() {
                            setPhase('idle');
                        }
                    });
                    return new Response(res.body.pipeThrough(ts), {
                        status: res.status,
                        statusText: res.statusText,
                        headers: res.headers
                    });
                }
                return send().then(track, function(e) {
                    setPhase('idle');
                    throw e;
                });
            };
        })();
    </script>

    <script src="./chatapp/chat-app.min.js?v=4"></script>
    <script>
        // Typing animation: cycles example prompts through the empty-state composer placeholder.
        // Pauses while the user has typed something; resumes when the box is cleared.
        (function() {
            var phrases = [
                'Refactor this 2,000-line module without changing its behavior…',
                'Why does this async function sometimes race?',
                'Summarize a 500-page spec and list the edge cases…',
                'Explain this traceback and propose a fix…',
                'Design a multi-step agent workflow with tool calls…',
                'Review my pull request like a senior engineer…'
            ];
            var idx = 0,
                pos = 0,
                dir = 1,
                timer = null;
            var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reduce) return;

            function tick() {
                var el = document.querySelector('.empty-input-box textarea');
                if (!el) {
                    timer = setTimeout(tick, 600);
                    return;
                }
                if (el.value) {
                    timer = setTimeout(tick, 400);
                    return;
                }
                var p = phrases[idx];
                if (dir > 0) {
                    pos++;
                    if (pos >= p.length) {
                        el.placeholder = p;
                        dir = -1;
                        timer = setTimeout(tick, 2000);
                        return;
                    }
                    el.placeholder = p.slice(0, pos) + '▍';
                    timer = setTimeout(tick, 26 + Math.random() * 38);
                } else {
                    pos -= 2;
                    if (pos <= 0) {
                        pos = 0;
                        dir = 1;
                        idx = (idx + 1) % phrases.length;
                        el.placeholder = '';
                        timer = setTimeout(tick, 380);
                        return;
                    }
                    el.placeholder = p.slice(0, pos) + '▍';
                    timer = setTimeout(tick, 12);
                }
            }
            timer = setTimeout(tick, 900);
        })();

        // Response actions: thumbs up/down (stored locally, no server call) + Regenerate on the latest reply.
        // Buttons are appended to each reply's action bar; the bundle exposes its retry handler as window.__oxRetry.
        (function() {
            var KEY = 'ox_feedback',
                fb = {};
            try {
                fb = JSON.parse(localStorage.getItem(KEY) || '{}') || {};
            } catch (e) {}

            function hash(s) {
                var h = 0;
                for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
                return 'm' + (h >>> 0).toString(36);
            }
            // Identity of the open chat: the sidebar lists chats sorted by updatedAt (newest first), and the
            // highlighted item's position maps onto the same ordering of the chats stored in localStorage.
            function activeChatId() {
                try {
                    var items = document.querySelectorAll('.sidebar .chat-item'),
                        k = -1;
                    for (var i = 0; i < items.length; i++)
                        if (items[i].classList.contains('active')) {
                            k = i;
                            break;
                        }
                    if (k < 0) return null;
                    var chats = JSON.parse(localStorage.getItem('chattest_chats') || '[]');
                    if (chats.length !== items.length) return null; // storage not yet in sync with the sidebar (new chat being created)
                    chats.sort(function(a, b) {
                        return new Date(b.updatedAt) - new Date(a.updatedAt);
                    });
                    return chats[k] && chats[k].id ? String(chats[k].id) : null;
                } catch (e) {
                    return null;
                }
            }
            window.__oxActiveChatId = activeChatId;
            // Vote key = which message (chat + position), plus a hash of its text so a regenerated reply
            // starts clean. Keying by text alone made identical replies in different chats share one vote.
            function idFor(msg) {
                var prose = msg.querySelector('.prose');
                var h = hash((prose ? prose.innerText : '').trim());
                var chat = activeChatId();
                var idx = Array.prototype.indexOf.call(document.querySelectorAll('.messages-col .msg-assistant'), msg);
                return chat ? chat + ':' + idx + ':' + h : h;
            }

            function svg(d) {
                return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
            }
            var UP = '<path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>';
            var DOWN = '<path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10z"/><path d="M17 2h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"/>';
            var RETRY = '<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>';

            function mk(cls, tip, inner) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'msg-action-btn ' + cls;
                b.setAttribute('data-tip', tip);
                b.setAttribute('aria-label', tip);
                b.innerHTML = inner;
                return b;
            }

            function augment(actions) {
                if (actions.dataset.ox) return;
                actions.dataset.ox = '1';
                var msg = actions.closest('.msg-assistant');
                if (!msg) return;
                var id = function() {
                    return idFor(msg);
                };
                var up = mk('ox-up', 'Good response', svg(UP));
                var down = mk('ox-down down', 'Bad response', svg(DOWN));
                var retry = mk('ox-retry', 'Regenerate', svg(RETRY));

                function paint() {
                    var k = id();
                    up.classList.toggle('active', fb[k] === 'up');
                    down.classList.toggle('active', fb[k] === 'down');
                }

                function vote(v) {
                    var k = id();
                    if (fb[k] === v) delete fb[k];
                    else fb[k] = v;
                    try {
                        localStorage.setItem(KEY, JSON.stringify(fb));
                    } catch (e) {}
                    paint();
                }
                actions.oxPaint = paint;
                up.addEventListener('click', function() {
                    vote('up');
                });
                down.addEventListener('click', function() {
                    vote('down');
                });
                retry.addEventListener('click', function() {
                    if (typeof window.__oxRetry !== 'function') return;
                    window.__oxRegen = true; // drop the last user+assistant pair, then resend the same prompt
                    try {
                        window.__oxRetry();
                    } finally {
                        setTimeout(function() {
                            window.__oxRegen = false;
                        }, 300);
                    }
                });
                paint();
                var sep = document.createElement('span');
                sep.className = 'ox-sep';
                actions.appendChild(sep);
                actions.appendChild(up);
                actions.appendChild(down);
                actions.appendChild(retry);
            }

            function scan() {
                document.querySelectorAll('.msg-assistant .msg-actions:not([data-ox])').forEach(augment);
                // Re-evaluate existing buttons too: React reuses DOM nodes by index, so a node may now show a different message.
                document.querySelectorAll('.msg-assistant .msg-actions[data-ox]').forEach(function(a) {
                    if (a.oxPaint) a.oxPaint();
                });
            }
            // Also watch class changes: switching chats with identical replies changes nothing in the message
            // DOM, only the sidebar's "active" item — and that's what the vote key depends on. Coalesce per frame.
            var queued = false;

            function schedule() {
                if (queued) return;
                queued = true;
                requestAnimationFrame(function() {
                    queued = false;
                    scan();
                });
            }
            new MutationObserver(schedule).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ['class']
            });
            scan();
        })();

        // Download button on every code block: saves the block as a file. The extension comes from the
        // fenced language (```html → .html); untagged blocks are sniffed (doctype → html, JSON, #!). If the
        // model wrote a file name on the first line ("<!-- index.html -->", "// app.js") that name is used.
        (function() {
            var EXT = {
                html: 'html',
                htm: 'html',
                xml: 'xml',
                svg: 'svg',
                css: 'css',
                scss: 'scss',
                sass: 'sass',
                less: 'less',
                js: 'js',
                javascript: 'js',
                mjs: 'mjs',
                jsx: 'jsx',
                ts: 'ts',
                typescript: 'ts',
                tsx: 'tsx',
                json: 'json',
                jsonc: 'json',
                py: 'py',
                python: 'py',
                php: 'php',
                rb: 'rb',
                ruby: 'rb',
                go: 'go',
                golang: 'go',
                rs: 'rs',
                rust: 'rs',
                java: 'java',
                kt: 'kt',
                kotlin: 'kt',
                swift: 'swift',
                c: 'c',
                h: 'h',
                cpp: 'cpp',
                'c++': 'cpp',
                cc: 'cpp',
                hpp: 'hpp',
                cs: 'cs',
                csharp: 'cs',
                sh: 'sh',
                bash: 'sh',
                shell: 'sh',
                zsh: 'sh',
                powershell: 'ps1',
                ps1: 'ps1',
                bat: 'bat',
                cmd: 'bat',
                sql: 'sql',
                yaml: 'yml',
                yml: 'yml',
                toml: 'toml',
                ini: 'ini',
                env: 'env',
                md: 'md',
                markdown: 'md',
                txt: 'txt',
                text: 'txt',
                plaintext: 'txt',
                vue: 'vue',
                svelte: 'svelte',
                lua: 'lua',
                r: 'r',
                dart: 'dart',
                scala: 'scala',
                perl: 'pl',
                pl: 'pl',
                graphql: 'graphql',
                gql: 'graphql',
                csv: 'csv',
                diff: 'diff',
                patch: 'patch',
                dockerfile: 'Dockerfile',
                docker: 'Dockerfile',
                makefile: 'Makefile',
                nginx: 'conf',
                apache: 'conf'
            };

            function langOf(header, code) {
                var m = /language-([\w+.-]+)/.exec(code.className || '');
                var l = m ? m[1] : (header.firstElementChild ? header.firstElementChild.textContent : '');
                return (l || '').trim().toLowerCase();
            }

            function sniff(text) {
                var t = text.replace(/^\s+/, '');
                if (/^<!doctype html|^<html[\s>]/i.test(t)) return 'html';
                if (/^<\?php/.test(t)) return 'php';
                if (/^<\?xml/.test(t)) return 'xml';
                if (/^<svg[\s>]/i.test(t)) return 'svg';
                if (/^#!.*\b(ba|z|da)?sh\b/.test(t)) return 'sh';
                if (/^#!.*python/.test(t)) return 'py';
                if (/^#!.*node/.test(t)) return 'js';
                if (/^[\[{]/.test(t)) {
                    try {
                        JSON.parse(t);
                        return 'json';
                    } catch (e) {}
                }
                return '';
            }

            function fileName(header, code) {
                var text = code.textContent || '';
                var first = text.split('\n')[0] || '';
                // A file name the model put in a comment on its own first line, e.g. "<!-- index.html -->", "// app.js", "# main.py"
                var named = /^\s*(?:\/\/|#|<!--|\/\*|--|;)\s*(?:file(?:name)?\s*:\s*)?([\w][\w.-]*\.[A-Za-z][A-Za-z0-9]{0,5})\s*(?:-->|\*\/)?\s*$/.exec(first);
                if (named) return named[1];
                var l = langOf(header, code);
                if (!l || l === 'code' || l === 'text' || l === 'plaintext' || l === 'txt') l = sniff(text) || 'txt';
                var ext = EXT[l] || (/^[a-z0-9]{1,6}$/.test(l) ? l : 'txt');
                if (ext === 'Dockerfile' || ext === 'Makefile') return ext;
                var prose = header.closest('.prose');
                var n = prose ? Array.prototype.indexOf.call(prose.querySelectorAll('.code-block-header'), header) + 1 : 1;
                return 'code-' + n + '.' + ext;
            }

            function save(name, text) {
                var blob = new Blob([text], {
                    type: 'text/plain;charset=utf-8'
                });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = name;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(function() {
                    URL.revokeObjectURL(url);
                }, 2000);
            }

            function augment(header) {
                if (header.dataset.dl) return;
                header.dataset.dl = '1';
                var pre = header.nextElementSibling;
                var code = pre && pre.tagName === 'PRE' ? pre.querySelector('code') : null;
                if (!code) return;
                var btn = document.createElement('span');
                btn.className = 'code-dl-btn';
                btn.setAttribute('role', 'button');
                btn.tabIndex = 0;
                btn.textContent = 'Download';
                btn.title = 'Save this code as a file';
                var timer = null;

                function go(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    var name = fileName(header, code);
                    save(name, code.textContent || '');
                    btn.textContent = 'Saved ' + name;
                    btn.classList.add('is-done');
                    clearTimeout(timer);
                    timer = setTimeout(function() {
                        btn.textContent = 'Download';
                        btn.classList.remove('is-done');
                    }, 1800);
                }
                btn.addEventListener('click', go);
                btn.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') go(e);
                });
                header.appendChild(btn);
            }

            function scan() {
                document.querySelectorAll('.code-block-header:not([data-dl])').forEach(augment);
                document.querySelectorAll('.code-copy-btn').forEach(function(b) {
                    b.classList.toggle('is-done', b.textContent === 'Copied!');
                });
            }
            new MutationObserver(scan).observe(document.body, {
                childList: true,
                subtree: true
            });
            scan();
        })();

        // Waiting status: replaces the three dots with shimmering text ("Connecting…", "Waiting for model…",
        // "Thinking…") driven by window.__oxPhase from the stream tracker above. Shows elapsed time once
        // thinking runs long, so a slow reasoning pass doesn't look like a hang.
        (function() {
            var LABEL = {
                connecting: 'Thinking…',
                queued: 'Waiting for model…',
                thinking: 'Thinking…',
                answering: 'Writing…',
                idle: 'Thinking…'
            };

            function text() {
                var p = window.__oxPhase || 'idle';
                var s = LABEL[p] || LABEL.idle;
                var secs = Math.floor((Date.now() - (window.__oxPhaseAt || Date.now())) / 1000);
                if (p === 'queued') {
                    // Queue time at the provider is highly variable (1 s … 2 min); say so before users assume it's broken.
                    if (secs >= 60) s = 'Still waiting — the model is under heavy load right now · ' + secs + 's';
                    else if (secs >= 15) s = 'The model is busy right now — usually under a minute · ' + secs + 's';
                    else if (secs >= 8) s = 'Waiting for model · ' + secs + 's…';
                } else if (p === 'thinking') {
                    if (secs >= 90) s = 'Still thinking — long answers take a while · ' + secs + 's';
                    else if (secs >= 8) s = 'Thinking for ' + secs + 's…';
                }
                return s;
            }

            function augment(dots) {
                if (dots.dataset.oxStatus) return;
                dots.dataset.oxStatus = '1';
                var el = document.createElement('i');
                el.className = 'ox-status';
                el.setAttribute('role', 'status');
                el.setAttribute('aria-live', 'polite');
                el.textContent = text();
                dots.appendChild(el);
            }

            function scan() {
                document.querySelectorAll('.typing-dots:not([data-ox-status])').forEach(augment);
            }

            function refresh() {
                var t = text();
                document.querySelectorAll('.ox-status').forEach(function(el) {
                    if (el.textContent !== t) el.textContent = t;
                });
            }
            new MutationObserver(scan).observe(document.body, {
                childList: true,
                subtree: true
            });
            scan();
            setInterval(refresh, 1000);
            // Phase flips happen between ticks; poll a bit faster so "Thinking…" shows up promptly.
            (function watch() {
                var last = '';
                setInterval(function() {
                    if (window.__oxPhase !== last) {
                        last = window.__oxPhase;
                        refresh();
                    }
                }, 150);
            })();
        })();

        // Mobile drawer: a close (×) button in the sidebar header and Escape-to-close. Both just trigger the
        // app's own overlay click handler, so the React state stays in charge of open/closed.
        (function() {
            function closeDrawer() {
                var o = document.querySelector('.sidebar-overlay.open');
                if (o) o.click();
            }

            function augment(top) {
                if (top.querySelector('.ox-drawer-close')) return;
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'ox-drawer-close';
                b.setAttribute('aria-label', 'Close menu');
                b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
                b.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    closeDrawer();
                });
                top.appendChild(b);
            }

            function scan() {
                document.querySelectorAll('.sidebar-header-top').forEach(augment);
            }
            new MutationObserver(scan).observe(document.body, {
                childList: true,
                subtree: true
            });
            scan();
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeDrawer();
            });
        })();

        // Updates button in sidebar list (under chat items) → /pages/pass
        (function() {
            function injectUpdatesButton() {
                var sidebar = document.querySelector('.sidebar');
                if (!sidebar) return false;

                // Find the chat list container - same as New Chat uses
                var chatList = sidebar.querySelector('[class*="chat-list"], ul, ol, .sidebar-chats') ||
                              sidebar.querySelector('.sidebar > div:last-child') ||
                              sidebar.querySelector('.sidebar > div > div:last-child');

                if (!chatList) return false;

                // Check if already added
                if (chatList.querySelector('.ox-updates-btn-item')) return true;

                // Create list item matching chat-item EXACTLY (structure expected by CSS for .sidebar.collapsed)
                var item = document.createElement('li');
                item.className = 'ox-updates-btn-item chat-item';

                        window.__oxStick = false;
                        update();
                    }
                }
            }, {
                passive: true,
                capture: true
            });
            document.addEventListener('touchmove', markUser, {
                passive: true,
                capture: true
            });
            document.addEventListener('mousedown', markUser, true);
            document.addEventListener('keydown', function(e) {
                if (/^(ArrowUp|PageUp|Home)$/.test(e.key)) {
                    markUser();
                    window.__oxStick = false;
                    update();
                }
            }, true);
            document.addEventListener('scroll', function(e) {
                var w = e.target;
                if (!w || !w.classList || !w.classList.contains('messages-wrap')) return;
                var d = distFromBottom(w);
                if (d <= 40) {
                    window.__oxStick = true;
                } else if (d > 120 && Date.now() - lastUserInput < 1200) {
                    window.__oxStick = false;
                }
                update();
            }, true);
            // Sending a message (or regenerating) always re-engages following
            document.addEventListener('click', function(e) {
                if (e.target.closest && e.target.closest('.send-btn, .ox-retry')) {
                    window.__oxStick = true;
                }
            }, true);
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey && e.target.tagName === 'TEXTAREA') {
                    window.__oxStick = true;
                }
            }, true);
            new MutationObserver(update).observe(document.body, {
                childList: true,
                subtree: true
            });
        })();
    </script>

    <!-- Latest Update Box (inside chat area) -->
    <script>
    (function() {
        var tagColors = { feature:'#3dd68c', fix:'#f06060', update:'#7c66e6', security:'#f0c040' };

        function createBox(u) {
            var color = tagColors[u.tag] || '#7c66e6';

            var box = document.createElement('a');
            box.href = '/pages/updates?id=0';
            box.id = 'latest-update-box';
            box.style.cssText = 'display:inline-flex;align-items:center;gap:8px;margin:0 0 8px 10px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;text-decoration:none;color:var(--text-primary);font-family:var(--font);transition:border-color .2s,transform .15s;flex-shrink:0;cursor:pointer;max-width:320px;width:fit-content;align-self:flex-start;';

            var dot = document.createElement('span');
            dot.style.cssText = 'width:7px;height:7px;border-radius:50%;background:'+color+';flex-shrink:0;';

            var text = document.createElement('div');
            text.style.cssText = 'min-width:0;flex:1;';
            text.innerHTML = '<div style="font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:'+color+';margin-bottom:2px;">Latest Update</div><div style="font-size:13px;font-weight:500;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+u.title+'</div><div style="font-size:11px;color:var(--text-muted);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;">'+u.desc+'</div>';

            var arrow = document.createElement('span');
            arrow.style.cssText = 'color:var(--text-muted);flex-shrink:0;transition:transform .15s;';
            arrow.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>';

            box.appendChild(dot);
            box.appendChild(text);
            box.appendChild(arrow);

            box.addEventListener('mouseenter', function() {
                this.style.borderColor = color;
                this.style.transform = 'translateY(-1px)';
                arrow.style.transform = 'translateX(2px)';
            });
            box.addEventListener('mouseleave', function() {
                this.style.borderColor = 'var(--border)';
                this.style.transform = 'translateY(0)';
                arrow.style.transform = 'translateX(0)';
            });

            // Always place box right before .input-area
            function inject() {
                var chatArea = document.querySelector('.chat-area');
                if (!chatArea) return false;
                var inputArea = chatArea.querySelector('.input-area');
                var target = inputArea || null;
                // Only move if box isn't already right before input-area
                if (box.nextElementSibling !== target || box.parentElement !== chatArea) {
                    if (target) {
                        chatArea.insertBefore(box, target);
                    } else {
                        chatArea.appendChild(box);
                    }
                }
                return true;
            }

            if (!inject()) {
                var obs = new MutationObserver(function() {
                    if (inject()) obs.disconnect();
                });
                obs.observe(document.body, { childList: true, subtree: true });
            }

            // Show/hide based on whether messages exist
            function checkMessages() {
                var chatArea = document.querySelector('.chat-area');
                if (!chatArea) return;
                var hasMessages = chatArea.querySelector('.msg') !== null;
                if (hasMessages) {
                    box.style.display = 'none';
                } else {
                    // Re-inject before .input-area every time (React may re-render)
                    inject();
                    box.style.display = 'inline-flex';
                }
            }

            var msgObs = new MutationObserver(checkMessages);
            function startWatching() {
                var chatArea = document.querySelector('.chat-area');
                if (chatArea) {
                    msgObs.observe(chatArea, { childList: true, subtree: true, characterData: true });
                    checkMessages();
                } else {
                    setTimeout(startWatching, 500);
                }
            }
            setTimeout(startWatching, 500);
        }

        fetch('/api/updates').then(function(r){return r.json()}).then(function(updates){
            if(updates && updates.length > 0) createBox(updates[0]);
        }).catch(function(){});
    })();
    </script>
